spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration

api:
  security:
    token:
      secret: test-secret-key-for-integration-tests-only