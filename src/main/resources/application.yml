spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: freteflow2

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    username: ${FRETEFLOW_RUNTIME_DB_USER}
    password: ${FRETEFLOW_RUNTIME_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    user: ${FRETEFLOW_MIGRATOR_DB_USER}
    password: ${FRETEFLOW_MIGRATOR_DB_PASSWORD}
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
api:
  security:
    token:
      secret: ${JWT_SECRET}